<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Flavour Forge</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <script src="assets/js/navbar.js" defer></script>
</head>
<body class="auth-page">
<header class="home-navbar">
    <div class="home-navbar__container">
        <a href="index.html" class="home-navbar__brand" aria-label="RK Sweets home">
            <img src="assets/images/rk-sweet-shop-logo.png" alt="RK Sweets Shop Logo" class="home-navbar__logo-img">
            <span class="home-navbar__brand-text">RK <small>Sweets</small></span>
        </a>
        <button class="home-navbar__toggle" type="button" aria-label="Toggle navigation" aria-controls="homeNavbarMenu" aria-expanded="false">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <nav id="homeNavbarMenu" class="home-navbar__menu" aria-label="Main navigation">
            <ul class="home-navbar__list">
                <li class="home-navbar__item"><a href="index.html" class="home-navbar__link">Home</a></li>
                <li class="home-navbar__item"><a href="index.html#trending-sweets" class="home-navbar__link">Products</a></li>
                <li class="home-navbar__item"><a href="index.html#trending-fast-food" class="home-navbar__link">Showcase</a></li>
                <li class="home-navbar__item"><a href="contact.html" class="home-navbar__link">Contact</a></li>
                <li class="home-navbar__item"><a href="about.html" class="home-navbar__link">About</a></li>
                <li class="home-navbar__item home-navbar__item--cta"><a href="signup.html" class="home-navbar__link home-navbar__link--cta">Sign Up</a></li>
            </ul>
        </nav>
    </div>
</header>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>Welcome Back!</h2>
                <p>Login to continue with The Flavour Forge</p>
            </div>
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-options">
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <div class="social-login">
                <p class="or-divider"><span>Or continue with</span></p>
                <div class="social-icons">
                    <a href="#" class="social-icon google"><i class="fab fa-google"></i></a>
                    <a href="#" class="social-icon facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-icon apple"><i class="fab fa-apple"></i></a>
                </div>
            </div>
            <div class="signup-link">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>
    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await handleLogin(email, password);
        });
    </script>
</body>
</html>
